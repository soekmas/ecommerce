version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: gocommerce-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks:
      - ecommerce_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: gocommerce-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecommerce_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gocommerce-redis
    volumes:
      - redisdata:/data
    networks:
      - ecommerce_network
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: gocommerce-frontend
    ports:
      - "5173:5173"
    networks:
      - ecommerce_network
    depends_on:
      - postgres
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: gocommerce-mailhog
    logging:
      driver: 'none'
    networks:
      - ecommerce_network
    restart: unless-stopped

networks:
  ecommerce_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
